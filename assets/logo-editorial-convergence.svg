<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" fill="none">
  <!-- Emblem Box -->
  <rect x="4" y="8" width="80" height="80" rx="20" fill="#1B3633"/>
  <rect x="5" y="9" width="78" height="78" rx="19" stroke="#C96442" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- Two diverging paths converging into balanced resolution -->
  <path d="M24 66 C24 48, 44 48, 44 24" stroke="#FAF8F5" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M64 66 C64 48, 44 48, 44 24" stroke="#C96442" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Balanced horizon / scale beam -->
  <path d="M22 44 H66" stroke="#E5DFD5" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 4"/>
  <!-- Blackthorn blossom / resolution node at apex -->
  <circle cx="44" cy="24" r="5" fill="#C96442" stroke="#FAF8F5" stroke-width="2"/>
  <circle cx="24" cy="66" r="3.5" fill="#FAF8F5"/>
  <circle cx="64" cy="66" r="3.5" fill="#C96442"/>
  <!-- Wordmark -->
  <text x="102" y="47" font-family="'Instrument Serif', Georgia, serif" font-size="34" font-weight="400" fill="#141413" letter-spacing="-0.02em">Blackthorn Resolute</text>
  <text x="104" y="69" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#C96442" letter-spacing="0.18em">MEDIATION · NEGOTIATION · CONFLICT RESOLUTION</text>
</svg>